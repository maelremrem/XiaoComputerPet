name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'include/**'
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e seeed_xiao_nrf52840

      - name: Show size
        run: pio run -e seeed_xiao_nrf52840 -t size

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/seeed_xiao_nrf52840/firmware.hex dist/XiaoComputerPet-${GITHUB_SHA::7}.hex
          cp .pio/build/seeed_xiao_nrf52840/firmware.elf dist/XiaoComputerPet-${GITHUB_SHA::7}.elf
          if [ -f .pio/build/seeed_xiao_nrf52840/firmware.bin ]; then
            cp .pio/build/seeed_xiao_nrf52840/firmware.bin dist/XiaoComputerPet-${GITHUB_SHA::7}.bin
          fi
          printf 'commit=%s\nref=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > dist/build-info.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoComputerPet-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
